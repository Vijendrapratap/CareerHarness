<!doctype html><html><body>
<form id="application">
  <label for="first_name">First Name*</label><input id="first_name" required>
  <label for="last_name">Last Name*</label><input id="last_name" required>
  <label for="email">Email*</label><input id="email" type="text" required>
  <label for="phone">Phone*</label><input id="phone" type="tel" required>
  <label for="candidate-location">Location (City)*</label><input id="candidate-location" required>
  <label for="resume">Attach</label><input id="resume" type="file">
  <div class="field">
    <label id="lbl_country" for="country">Country*</label>
    <input id="country" role="combobox" aria-labelledby="lbl_country" aria-required="true" autocomplete="off" data-async="1">
    <ul role="listbox" hidden></ul>
  </div>
  <label for="question_1">LinkedIn Profile</label><input id="question_1">
  <label for="question_2">Why do you want to work at Acme?*</label><textarea id="question_2" required></textarea>
  <div class="field">
    <label id="lbl_auth" for="question_3">Are you legally authorized to work in the United States?*</label>
    <input id="question_3" role="combobox" aria-labelledby="lbl_auth" aria-required="true" autocomplete="off" readonly>
    <ul role="listbox" hidden><li role="option">Yes</li><li role="option">No</li></ul>
  </div>
  <div class="field">
    <label id="lbl_gender" for="gender">Gender*</label>
    <input id="gender" role="combobox" aria-labelledby="lbl_gender" aria-required="true" autocomplete="off" readonly>
    <ul role="listbox" hidden><li role="option">Male</li><li role="option">Female</li><li role="option">Decline To Self Identify</li></ul>
  </div>
  <div class="field">
    <label id="lbl_office" for="office">Preferred office*</label>
    <input id="office" role="combobox" aria-labelledby="lbl_office" aria-required="true" autocomplete="off">
    <ul role="listbox" hidden><li role="option">Berlin</li><li role="option">Paris</li></ul>
  </div>
  <div class="field">
    <label id="lbl_dial" for="dial">Dial code</label>
    <input id="dial" role="combobox" aria-labelledby="lbl_dial" autocomplete="off" readonly data-stuck="+1">
    <ul role="listbox" hidden><li role="option">United States +1</li><li role="option">United Kingdom +44</li></ul>
  </div>
  <iframe title="reCAPTCHA" src="about:blank#recaptcha" style="display:none"></iframe>
  <p id="errors"></p>
  <button type="submit">Submit application</button>
</form>
<script src="_thanks.js"></script>
<script>document.querySelectorAll("[role=combobox]").forEach((i) => i.removeAttribute("required"));</script>
<script>
  // Minimal react-select-like combobox: click opens the list, clicking an option sets the value.
  document.querySelectorAll("[role=combobox]").forEach((input) => {
    const list = input.nextElementSibling;
    input.addEventListener("click", () => { list.hidden = false; });
    input.addEventListener("keydown", (e) => { if (e.key === "Escape") list.hidden = true; });
    const shown = document.createElement("div");
    shown.className = "select__single-value";
    input.parentElement.insertBefore(shown, list);
    const choose = (opt) => opt.addEventListener("click", () => {
      // data-stuck imitates a widget that ignores the click and keeps showing its default
      shown.textContent = input.dataset.stuck || opt.textContent; input.value = "";
      input.dataset.chosen = opt.textContent; list.hidden = true;
    });
    list.querySelectorAll("[role=option]").forEach(choose);
    if (input.dataset.async) {  // options appear only after typing (country search)
      input.readOnly = false;
      input.addEventListener("input", () => {
        const all = ["United States", "United Kingdom", "India"];
        list.innerHTML = "";
        all.filter((c) => c.toLowerCase().includes(input.value.toLowerCase())).forEach((c) => {
          const li = document.createElement("li"); li.setAttribute("role", "option"); li.textContent = c;
          list.appendChild(li); choose(li);
        });
        list.hidden = false;
      });
    }
  });
  wireSubmit("application");
</script>
</body></html>
